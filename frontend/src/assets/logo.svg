<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title">
  <!-- App icon: Lucide Calculator (https://lucide.dev/icons/calculator) — ISC License -->
  <title id="title">Contabilidad</title>
  <rect width="64" height="64" rx="14" fill="#059669"/>
  <g
    transform="translate(8 8) scale(2)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect width="16" height="20" x="4" y="2" rx="2"/>
    <line x1="8" x2="16" y1="6" y2="6"/>
    <line x1="16" x2="16" y1="14" y2="18"/>
    <!-- Keypad dots as circles so they stay crisp at favicon size -->
    <circle cx="8" cy="10" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="12" cy="10" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="16" cy="10" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="8" cy="14" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="12" cy="14" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="8" cy="18" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="12" cy="18" r="0.9" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
