[project]
name = "spain_compliance"
authors = [
    { name = "Xappiens", email = "hello@xappiens.com"}
]
description = "Spanish accounting and compliance for ERPNext: Plan General Contable, credit-note series, collection statuses and an accounting UI"
readme = "README.md"
license = { file = "license.txt" }
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["frappe", "erpnext", "spain", "accounting", "pgc", "aeat", "contabilidad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[project.urls]
Homepage = "https://github.com/xappiens-ai/spain_compliance"
Repository = "https://github.com/xappiens-ai/spain_compliance"
Issues = "https://github.com/xappiens-ai/spain_compliance/issues"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
